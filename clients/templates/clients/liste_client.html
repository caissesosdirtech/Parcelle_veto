{% extends "base_dashboard.html" %}
{% block content %}

<style>
.lc { --bleu:#1f6feb; --bleu-f:#0d47a1; --encre:#0F2547; --gris:#6B7A90; --trait:#E8EDF4; --fond:#F4F7FB;
      font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--encre); }
.lc a { text-decoration:none; }

/* En-tête */
.lc-tete { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.lc-tete h1 { margin:0; font-size:1.5rem; font-weight:800; letter-spacing:-.01em; }
.lc-tete .sous { font-size:.88rem; color:var(--gris); margin-top:3px; }
.lc-actions { display:flex; gap:8px; flex-wrap:wrap; }
.lc-btn { display:inline-flex; align-items:center; gap:7px; padding:10px 14px; border-radius:12px; font-weight:700; font-size:.85rem;
          border:1px solid var(--trait); background:#fff; color:var(--encre); cursor:pointer; font-family:inherit; }
.lc-btn:hover { border-color:#C9D8F5; color:var(--encre); }
.lc-btn-p { background:linear-gradient(135deg,var(--bleu),var(--bleu-f)); border-color:transparent; color:#fff; box-shadow:0 6px 14px rgba(31,111,235,.25); }
.lc-btn-p:hover { color:#fff; filter:brightness(1.05); }

/* Barre de recherche et filtres */
.lc-barre { background:#fff; border:1px solid var(--trait); border-radius:18px; padding:14px; margin-bottom:18px; }
.lc-recherche { display:flex; gap:10px; flex-wrap:wrap; }
.lc-champ { flex:1; min-width:240px; position:relative; }
.lc-champ i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#8A9AAD; }
.lc-champ input { width:100%; box-sizing:border-box; height:46px; padding:0 40px 0 40px; border:1.5px solid var(--trait); border-radius:13px;
                  background:var(--fond); font:inherit; font-size:.95rem; color:var(--encre); }
.lc-champ input:focus { outline:none; border-color:var(--bleu); background:#fff; box-shadow:0 0 0 4px rgba(31,111,235,.1); }
.lc-effacer { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:#E8EDF4; color:#5B6B80;
              width:26px; height:26px; border-radius:50%; cursor:pointer; display:none; }
.lc-tri { height:46px; padding:0 12px; border:1.5px solid var(--trait); border-radius:13px; background:#fff; font:inherit; font-size:.88rem; color:var(--encre); }
.lc-especes { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.lc-espece { padding:7px 12px; border-radius:20px; border:1px solid var(--trait); background:#fff; color:#475569; font:inherit;
             font-size:.82rem; font-weight:600; cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
.lc-espece:hover { border-color:#C9D8F5; }
.lc-espece.on { background:var(--encre); border-color:var(--encre); color:#fff; }
.lc-resume { font-size:.85rem; color:var(--gris); margin:0 2px 12px; }
.lc-resume b { color:var(--encre); }

/* Cartes clients */
.lc-grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:16px; }
.lc-carte { background:#fff; border:1px solid var(--trait); border-radius:18px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:12px;
            transition:border-color .15s, box-shadow .15s; }
.lc-carte:hover { border-color:#C9D8F5; box-shadow:0 12px 28px rgba(15,40,80,.08); }
.lc-c-tete { display:flex; gap:12px; align-items:center; }
.lc-ini { width:46px; height:46px; border-radius:14px; flex:none; display:flex; align-items:center; justify-content:center;
          font-weight:800; font-size:1.15rem; color:#fff; }
.lc-nom { font-weight:800; font-size:1.02rem; color:var(--encre); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
a.lc-nom:hover { color:var(--bleu); }
.lc-meta { font-size:.8rem; color:var(--gris); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lc-modif { margin-left:auto; flex:none; border:none; background:var(--fond); color:#475569; width:34px; height:34px; border-radius:10px; cursor:pointer; }
.lc-modif:hover { background:#EAF1FE; color:var(--bleu); }
.lc-coord { display:flex; gap:8px; flex-wrap:wrap; }
.lc-coord a, .lc-coord span { display:inline-flex; align-items:center; gap:6px; font-size:.82rem; padding:5px 10px; border-radius:9px; background:var(--fond); color:#334155; }
.lc-coord a:hover { background:#EAF1FE; color:var(--bleu); }
.lc-coord .wa { background:#E8F8EE; color:#15803D; }
.lc-animaux { display:flex; flex-direction:column; gap:6px; }
.lc-animal { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; border:1px solid var(--trait); color:inherit; }
.lc-animal:hover { border-color:#C9D8F5; background:#FBFDFF; color:inherit; }
.lc-animal .e { width:32px; height:32px; border-radius:10px; background:#EAF1FE; display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex:none; }
.lc-animal .n { font-weight:700; font-size:.88rem; }
.lc-animal .d { font-size:.76rem; color:var(--gris); }
.lc-animal .f { margin-left:auto; color:#B0BCC9; }
.lc-sans { font-size:.82rem; color:#9AA8B8; padding:6px 2px; }
.lc-pied { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:10px; border-top:1px solid var(--trait); }
.lc-visite { font-size:.78rem; color:var(--gris); }
.lc-visite b { color:var(--encre); font-weight:600; }
.lc-ouvrir { margin-left:auto; font-size:.82rem; font-weight:700; color:#fff; background:var(--encre); padding:8px 12px; border-radius:10px; white-space:nowrap; }
.lc-ouvrir:hover { background:var(--bleu); color:#fff; }

/* Pagination */
.lc-pages { display:flex; gap:6px; justify-content:center; align-items:center; margin-top:20px; flex-wrap:wrap; }
.lc-pages button { min-width:38px; height:38px; padding:0 10px; border:1px solid var(--trait); background:#fff; border-radius:10px;
                   cursor:pointer; font:inherit; font-weight:600; font-size:.85rem; color:#475569; }
.lc-pages button:hover:not(:disabled) { border-color:var(--bleu); color:var(--bleu); }
.lc-pages button.on { background:var(--bleu); border-color:var(--bleu); color:#fff; }
.lc-pages button:disabled { opacity:.45; cursor:default; }
.lc-pages span { color:#9AA8B8; padding:0 2px; }

/* États */
.lc-vide { text-align:center; padding:50px 20px; color:#8A9AAD; background:#fff; border:1px dashed var(--trait); border-radius:18px; }
.lc-vide .ic { font-size:2.4rem; display:block; margin-bottom:8px; }
.lc-squelette { height:210px; border-radius:18px; background:linear-gradient(90deg,#EEF2F7 25%,#F7F9FC 37%,#EEF2F7 63%); background-size:400% 100%; animation:lcCharge 1.2s ease infinite; }
@keyframes lcCharge { 0% { background-position:100% 0; } 100% { background-position:0 0; } }
@media (prefers-reduced-motion: reduce) { .lc-squelette { animation:none; } }
@media (max-width: 560px) { .lc-grille { grid-template-columns:1fr; } }

/* ===== MODAL MODIFICATION CLIENT ===== */
.modal-backdrop {
    display:none; position:fixed; inset:0; z-index:9999;
    background:rgba(15,23,42,.55); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; padding:20px;
}
.modal-backdrop.show { display:flex; }
.client-modal {
    width:min(920px, 100%); max-height:92vh; overflow:auto;
    background:#fff; border-radius:20px; box-shadow:0 25px 70px rgba(0,0,0,.22);
}
.modal-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 24px; border-bottom:1px solid #edf1f6; position:sticky; top:0;
    background:#fff; z-index:2;
}
.modal-head h3 { margin:0; color:#1e2a3a; font-size:1.1rem; }
.modal-close { border:0; background:#f4f7fb; width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:1.1rem; }
.modal-body { padding:22px 24px; }
.form-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-size:.75rem; font-weight:700; color:#66758a; }
.form-group input, .form-group select {
    padding:11px 12px; border:1.5px solid #e3e9f0; border-radius:10px;
    outline:none; font-size:.86rem; background:#fbfcfe;
}
.form-group input:focus, .form-group select:focus { border-color:#1f6feb; background:#fff; box-shadow:0 0 0 4px rgba(31,111,235,.08); }
.animals-editor { margin-top:22px; }
.animals-editor-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.animals-editor-head strong { color:#1e2a3a; }
.btn-add-animal { border:0; padding:8px 12px; border-radius:9px; background:#e8f0fe; color:#1f6feb; font-weight:700; cursor:pointer; }
.animal-edit-row {
    display:grid; grid-template-columns:1.2fr 1fr 1fr .8fr .8fr .8fr auto; gap:7px;
    padding:10px; margin-bottom:8px; border:1px solid #e8edf3; border-radius:12px; background:#fafcff;
}
.animal-edit-row input, .animal-edit-row select { width:100%; box-sizing:border-box; padding:8px; border:1px solid #dfe6ee; border-radius:8px; font-size:.78rem; }
.btn-remove-animal { border:0; background:#feecec; color:#c62828; width:34px; border-radius:8px; cursor:pointer; font-weight:800; }
.modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 24px; border-top:1px solid #edf1f6; position:sticky; bottom:0; background:#fff; }
.btn-secondary, .btn-primary { border:0; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; }
.btn-secondary { background:#f1f4f8; color:#536274; }
.btn-primary { background:#1f6feb; color:#fff; }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; }
.edit-client-btn {
    border:0; background:#eef5ff; color:#1f6feb; width:34px; height:34px;
    border-radius:9px; cursor:pointer; font-size:.95rem; margin-left:4px;
}
.edit-client-btn:hover { background:#1f6feb; color:#fff; }
.alert-modal { display:none; margin-bottom:14px; padding:10px 12px; border-radius:10px; font-size:.82rem; font-weight:600; }
.alert-modal.show { display:block; }
.alert-modal.error { background:#fff0f0; color:#b42318; border:1px solid #ffd5d2; }
.alert-modal.success { background:#ecfdf3; color:#067647; border:1px solid #abefc6; }
@media(max-width:850px) { .animal-edit-row { grid-template-columns:repeat(2,1fr); } }
@media(max-width:650px) { .form-grid { grid-template-columns:1fr; } .form-group.full { grid-column:auto; } .modal-body { padding:16px; } .modal-head, .modal-foot { padding:15px 16px; } }
</style>

<div class="lc">
    <div class="lc-tete">
        <div>
            <h1>Clients et animaux</h1>
            <div class="sous"><span id="totalClients">0</span> clients · <span id="totalAnimaux">0</span> animaux enregistrés</div>
        </div>
        <div class="lc-actions">
            <a href="/clients/export/excel/" class="lc-btn"><i class="fa-solid fa-file-excel" style="color:#15803D"></i> Excel</a>
            <a href="/clients/export/pdf/" class="lc-btn"><i class="fa-solid fa-file-pdf" style="color:#DC2626"></i> PDF</a>
            <a href="{% url 'nouvelle_consultation' %}" class="lc-btn lc-btn-p"><i class="fa-solid fa-stethoscope"></i> Nouvelle consultation</a>
        </div>
    </div>

    <div class="lc-barre">
        <div class="lc-recherche">
            <div class="lc-champ">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="search" placeholder="Rechercher un client, un téléphone, une adresse ou un animal" autocomplete="off">
                <button type="button" class="lc-effacer" id="effacer" aria-label="Effacer la recherche">✕</button>
            </div>
            <select id="tri" class="lc-tri" aria-label="Trier">
                <option value="">Derniers ajoutés</option>
                <option value="visite">Dernière visite</option>
                <option value="nom">Ordre alphabétique</option>
            </select>
        </div>
        <div class="lc-especes" role="group" aria-label="Filtrer par espèce">
            <button type="button" class="lc-espece on" data-espece="">Toutes</button>
            <button type="button" class="lc-espece" data-espece="Chien">🐕 Chiens</button>
            <button type="button" class="lc-espece" data-espece="Chat">🐈 Chats</button>
            <button type="button" class="lc-espece" data-espece="Ovin">🐑 Ovins</button>
            <button type="button" class="lc-espece" data-espece="Caprin">🐐 Caprins</button>
            <button type="button" class="lc-espece" data-espece="Bovin">🐄 Bovins</button>
            <button type="button" class="lc-espece" data-espece="Cheval">🐎 Chevaux</button>
            <button type="button" class="lc-espece" data-espece="Volaille">🐓 Volailles</button>
        </div>
    </div>

    <div class="lc-resume" id="resume"></div>
    <div id="tableContainer" class="lc-grille" aria-live="polite"></div>
    <div class="lc-pages" id="pagination"></div>
</div>

<!-- MODIFICATION CLIENT + ANIMAUX -->
<div id="clientModal" class="modal-backdrop" onclick="fermerEditionClient(event)">
    <div class="client-modal" onclick="event.stopPropagation()">
        <div class="modal-head">
            <h3>✏️ Modifier le client et ses animaux</h3>
            <button class="modal-close" onclick="fermerEditionClient()">✕</button>
        </div>
        <div class="modal-body">
            <div id="modalAlert" class="alert-modal"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nom du client *</label>
                    <input id="editNom" type="text" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input id="editTelephone" type="tel" autocomplete="tel">
                </div>
                <div class="form-group full">
                    <label>Adresse</label>
                    <input id="editAdresse" type="text" autocomplete="street-address">
                </div>
            </div>

            <div class="animals-editor">
                <div class="animals-editor-head">
                    <strong>🐾 Animaux du client</strong>
                    <button class="btn-add-animal" type="button" onclick="ajouterLigneAnimal()">＋ Ajouter un animal</button>
                </div>
                <div id="animalsEditor"></div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn-secondary" type="button" onclick="fermerEditionClient()">Annuler</button>
            <button id="btnSaveClient" class="btn-primary" type="button" onclick="enregistrerClient()">💾 Enregistrer</button>
        </div>
    </div>
</div>

<script>

let page = 1;
let timer = null;
let clientEnEdition = null;
let animauxASupprimer = [];

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, function(ch) {
        return ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"})[ch];
    });
}

function afficherAlerteModal(message, type="error") {
    const el = document.getElementById("modalAlert");
    el.textContent = message;
    el.className = "alert-modal show " + type;
}

function masquerAlerteModal() {
    const el = document.getElementById("modalAlert");
    el.className = "alert-modal";
    el.textContent = "";
}

function ouvrirEditionClient(clientId) {
    clientEnEdition = clientId;
    animauxASupprimer = [];
    masquerAlerteModal();
    document.getElementById("clientModal").classList.add("show");
    document.getElementById("animalsEditor").innerHTML = "<div style='padding:20px;text-align:center;color:#8a98aa;'>Chargement du dossier…</div>";

    fetch(`/clients/api/${clientId}/dossier/`)
        .then(async r => {
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || "Impossible de charger le client.");
            return data;
        })
        .then(data => {
            document.getElementById("editNom").value = data.client.nom || "";
            document.getElementById("editTelephone").value = data.client.telephone || "";
            document.getElementById("editAdresse").value = data.client.adresse || "";
            document.getElementById("animalsEditor").innerHTML = "";
            (data.animaux || []).forEach(a => ajouterLigneAnimal(a));
        })
        .catch(err => afficherAlerteModal(err.message));
}

function fermerEditionClient(event) {
    if (event && event.target && event.target.id !== "clientModal") return;
    document.getElementById("clientModal").classList.remove("show");
    clientEnEdition = null;
}

function ajouterLigneAnimal(animal = {}) {
    const row = document.createElement("div");
    row.className = "animal-edit-row";
    row.dataset.id = animal.id || "";
    row.innerHTML = `
        <input class="animal-nom" type="text" placeholder="Nom *" value="${escapeHtml(animal.nom || "")}">
        <select class="animal-espece">
            <option value="">Espèce *</option>
            ${["Chien","Chat","Bovin","Ovin","Caprin","Volaille","Cheval","Autre"].map(x => `<option value="${x}" ${animal.espece === x ? "selected" : ""}>${x}</option>`).join("")}
        </select>
        <input class="animal-race" type="text" placeholder="Race" value="${escapeHtml(animal.race || "")}">
        <select class="animal-sexe">
            <option value="">Sexe</option>
            <option value="Mâle" ${animal.sexe === "Mâle" ? "selected" : ""}>Mâle</option>
            <option value="Femelle" ${animal.sexe === "Femelle" ? "selected" : ""}>Femelle</option>
        </select>
        <input class="animal-poids" type="number" step="0.01" min="0" placeholder="Poids" value="${animal.poids || ""}">
        <span style="font-size:.68rem;color:#8a98aa;align-self:center;">${animal.id ? "ID " + animal.id : "Nouveau"}</span>
        <button class="btn-remove-animal" type="button" title="Supprimer" onclick="supprimerLigneAnimal(this)">✕</button>
    `;
    document.getElementById("animalsEditor").appendChild(row);
}

function supprimerLigneAnimal(button) {
    const row = button.closest(".animal-edit-row");
    if (row.dataset.id) animauxASupprimer.push(Number(row.dataset.id));
    row.remove();
}

function lireAnimauxFormulaire() {
    const rows = [...document.querySelectorAll("#animalsEditor .animal-edit-row")];
    const animaux = [];
    for (const row of rows) {
        const nom = row.querySelector(".animal-nom").value.trim();
        const espece = row.querySelector(".animal-espece").value.trim();
        if (!nom || !espece) {
            throw new Error("Chaque animal doit avoir au minimum un nom et une espèce.");
        }
        const poids = row.querySelector(".animal-poids").value;
        const item = {
            nom, espece,
            race: row.querySelector(".animal-race").value.trim(),
            sexe: row.querySelector(".animal-sexe").value,
            poids: poids ? Number(poids) : null
        };
        if (row.dataset.id) item.id = Number(row.dataset.id);
        animaux.push(item);
    }
    return animaux;
}

async function enregistrerClient() {
    const btn = document.getElementById("btnSaveClient");
    masquerAlerteModal();
    try {
        const nom = document.getElementById("editNom").value.trim();
        if (!nom) throw new Error("Le nom du client est obligatoire.");

        const payload = {
            nom,
            telephone: document.getElementById("editTelephone").value.trim(),
            adresse: document.getElementById("editAdresse").value.trim(),
            animaux: lireAnimauxFormulaire(),
            supprimer_animaux: [...new Set(animauxASupprimer)]
        };

        btn.disabled = true;
        btn.textContent = "⏳ Enregistrement…";

        const response = await fetch(`/clients/api/${clientEnEdition}/modifier/`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Erreur lors de l'enregistrement.");

        afficherAlerteModal("Client et animaux modifiés avec succès.", "success");
        setTimeout(() => {
            fermerEditionClient();
            loadData();
        }, 500);
    } catch (err) {
        afficherAlerteModal(err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "💾 Enregistrer";
    }
}

let espece = "";
const COULEURS = ["#1f6feb", "#0EA5A4", "#7C3AED", "#EA580C", "#0B7A5E", "#DB2777", "#2563EB", "#B45309"];

function emojiEspece(e) {
    e = (e || "").toLowerCase();
    if (e.includes("chien")) return "🐕";
    if (e.includes("chat")) return "🐈";
    if (e.includes("bovin") || e.includes("vache") || e.includes("boeuf")) return "🐄";
    if (e.includes("ovin") || e.includes("mouton") || e.includes("bélier")) return "🐑";
    if (e.includes("caprin") || e.includes("chèvre") || e.includes("chevre")) return "🐐";
    if (e.includes("cheval") || e.includes("équin") || e.includes("âne")) return "🐎";
    if (e.includes("volaille") || e.includes("poule") || e.includes("poulet")) return "🐓";
    if (e.includes("lapin")) return "🐇";
    return "🐾";
}

function sexeLibelle(s) {
    if (s === "M") return "Mâle";
    if (s === "F") return "Femelle";
    return s || "";
}

function carteClient(c) {
    const initiale = (c.nom || "?").trim().charAt(0).toUpperCase();
    const couleur = COULEURS[c.id % COULEURS.length];
    const animaux = c.animaux.length
        ? c.animaux.map(a => `
            <a class="lc-animal" href="/animaux/${a.id}/historique/" title="Historique de ${escapeHtml(a.nom)}">
                <span class="e">${emojiEspece(a.espece)}</span>
                <span><span class="n">${escapeHtml(a.nom)}</span><br>
                <span class="d">${[a.espece, a.race, sexeLibelle(a.sexe)].filter(Boolean).map(escapeHtml).join(" · ")}</span></span>
                <i class="fa-solid fa-chevron-right f"></i>
            </a>`).join("")
        : `<div class="lc-sans">Aucun animal enregistré</div>`;

    const tel = c.telephone
        ? `<a href="tel:${escapeHtml(c.telephone)}"><i class="fa-solid fa-phone"></i> ${escapeHtml(c.telephone)}</a>
           ${c.telephone_wa ? `<a class="wa" href="https://wa.me/${c.telephone_wa}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ""}`
        : `<span><i class="fa-solid fa-phone-slash"></i> Pas de téléphone</span>`;

    const visite = c.derniere_visite
        ? `Dernière visite <b>${escapeHtml(c.derniere_visite_depuis)}</b>`
        : `Pas encore de consultation`;

    return `
    <article class="lc-carte">
        <div class="lc-c-tete">
            <span class="lc-ini" style="background:${couleur}">${escapeHtml(initiale)}</span>
            <div style="min-width:0;">
                <a class="lc-nom" href="/clients/${c.id}/historique/">${escapeHtml(c.nom)}</a>
                <div class="lc-meta"><i class="fa-solid fa-location-dot"></i> ${escapeHtml(c.adresse || "Adresse non renseignée")}</div>
            </div>
            <button class="lc-modif" title="Modifier le client et ses animaux" aria-label="Modifier ${escapeHtml(c.nom)}" onclick="ouvrirEditionClient(${c.id})">
                <i class="fa-solid fa-pen"></i>
            </button>
        </div>
        <div class="lc-coord">${tel}</div>
        <div class="lc-animaux">${animaux}</div>
        <div class="lc-pied">
            <span class="lc-visite">${visite}${c.nb_consultations ? ` · ${c.nb_consultations} consultation${c.nb_consultations > 1 ? "s" : ""}` : ""}</span>
            <a class="lc-ouvrir" href="/clients/${c.id}/historique/">Ouvrir le dossier</a>
        </div>
    </article>`;
}

function loadData(){
    const search = document.getElementById("search").value.trim();
    const tri = document.getElementById("tri").value;
    const zone = document.getElementById("tableContainer");
    document.getElementById("effacer").style.display = search ? "block" : "none";
    zone.innerHTML = '<div class="lc-squelette"></div><div class="lc-squelette"></div><div class="lc-squelette"></div>';

    const params = new URLSearchParams({ search: search, espece: espece, page: page, tri: tri });
    fetch(`/clients/api/?${params}`)
    .then(r => r.json())
    .then(data => {
        document.getElementById("totalClients").innerText = data.total_clients;
        document.getElementById("totalAnimaux").innerText = data.total_animaux;

        const filtre = search || espece;
        document.getElementById("resume").innerHTML = filtre
            ? `<b>${data.count}</b> client${data.count > 1 ? "s" : ""} trouvé${data.count > 1 ? "s" : ""}`
              + (search ? ` pour « ${escapeHtml(search)} »` : "")
              + (espece ? ` avec des ${escapeHtml(espece.toLowerCase())}s` : "")
            : "";

        if (!data.results.length) {
            zone.innerHTML = `
                <div class="lc-vide" style="grid-column:1/-1;">
                    <span class="ic">🔎</span>
                    <b>Aucun client trouvé</b><br>
                    <span style="font-size:.88rem;">Vérifiez l'orthographe, ou essayez avec le téléphone ou le nom de l'animal.</span>
                </div>`;
            document.getElementById("pagination").innerHTML = "";
            return;
        }
        zone.innerHTML = data.results.map(carteClient).join("");
        renderPagination(data);
    })
    .catch(() => {
        zone.innerHTML = `<div class="lc-vide" style="grid-column:1/-1;"><span class="ic">⚠️</span><b>Impossible de charger les clients.</b><br>
            <span style="font-size:.88rem;">Vérifiez la connexion, puis rechargez la page.</span></div>`;
    });
}

function renderPagination(data){
    const total = data.num_pages || 1;
    if (total <= 1) { document.getElementById("pagination").innerHTML = ""; return; }
    const pages = new Set([1, total, page - 1, page, page + 1]);
    let html = `<button ${page <= 1 ? "disabled" : ""} onclick="changePage(${page - 1})" aria-label="Page précédente">‹</button>`;
    let precedent = 0;
    [...pages].filter(p => p >= 1 && p <= total).sort((a, b) => a - b).forEach(p => {
        if (p - precedent > 1) html += `<span>…</span>`;
        html += `<button class="${p === page ? "on" : ""}" onclick="changePage(${p})">${p}</button>`;
        precedent = p;
    });
    html += `<button ${page >= total ? "disabled" : ""} onclick="changePage(${page + 1})" aria-label="Page suivante">›</button>`;
    document.getElementById("pagination").innerHTML = html;
}

function changePage(p){
    page = p;
    loadData();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("search").addEventListener("input", function(){
    clearTimeout(timer);
    page = 1;
    timer = setTimeout(loadData, 300);
});

document.getElementById("effacer").addEventListener("click", function(){
    document.getElementById("search").value = "";
    page = 1;
    loadData();
    document.getElementById("search").focus();
});

document.getElementById("tri").addEventListener("change", function(){
    page = 1;
    loadData();
});

document.querySelectorAll(".lc-espece").forEach(function (b) {
    b.addEventListener("click", function () {
        document.querySelectorAll(".lc-espece").forEach(x => x.classList.toggle("on", x === b));
        espece = b.dataset.espece;
        page = 1;
        loadData();
    });
});

window.onload = loadData;

</script>

{% endblock %}
